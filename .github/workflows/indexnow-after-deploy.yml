name: IndexNow after deploy

on:
  workflow_run:
    workflows: [npm test]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: indexnow-production
  cancel-in-progress: true

jobs:
  notify-indexnow:
    if: >-
      github.repository == 'denyappbuilder/realtech-web' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == 'denyappbuilder/realtech-web'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # This code comes from the default-branch workflow, before any checkout.
      # Do not consume artifacts or run a PR/fork's scripts in workflow_run.
      - name: Validate trusted run and current main before checkout
        id: source
        uses: actions/github-script@v8
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          script: |
            // Bound bootstrap responses too; no checkout or artifact download yet.
            const get = async suffix => {
              const response = await fetch(`https://api.github.com/repos/denyappbuilder/realtech-web${suffix}`, {
                redirect: 'error', signal: AbortSignal.timeout(10000),
                headers: { Authorization: `Bearer ${process.env.GITHUB_TOKEN}`, Accept: 'application/vnd.github+json' }
              });
              if (response.status !== 200 || response.redirected || !response.body) throw new Error('Bootstrap API unavailable');
              const reader = response.body.getReader();
              const chunks = []; let size = 0;
              try {
                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  size += value.length;
                  if (size > 1048576) throw new Error('Bootstrap response too large');
                  chunks.push(value);
                }
                return JSON.parse(Buffer.concat(chunks).toString());
              } finally { await reader.cancel(); }
            };
            const repo = 'denyappbuilder/realtech-web';
            const input = context.payload.workflow_run;
            const valid = r => r.repository?.full_name === repo &&
              r.head_repository?.full_name === repo && r.event === 'push' &&
              r.head_branch === 'main' && r.status === 'completed' &&
              r.conclusion === 'success' && r.name === 'npm test' &&
              r.path === '.github/workflows/npm-test.yml' && r.workflow_id === 337523728 &&
              Number.isSafeInteger(r.id) && r.id > 0 && /^[a-f0-9]{40}$/.test(r.head_sha);
            if (context.payload.repository?.full_name !== repo || !valid(input)) {
              throw new Error('Untrusted workflow input');
            }
            const run = await get(`/actions/runs/${input.id}`);
            const ref = await get('/git/ref/heads/main');
            if (!valid(run) || run.id !== input.id || run.head_sha !== input.head_sha || ref.object.sha !== run.head_sha) {
              throw new Error('Run identity or current main changed');
            }
            core.setOutput('sha', run.head_sha);
      - uses: actions/checkout@v7
        with:
          repository: denyappbuilder/realtech-web
          ref: ${{ steps.source.outputs.sha }}
          persist-credentials: false
          # B18: git diff proti předchozímu produkčnímu běhu potřebuje historii.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify deployed build and notify IndexNow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/indexnow-after-deploy.mjs
