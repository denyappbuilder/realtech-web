# Týdenní kontrola závislostí. Bez labels — Dependabot dává výchozí
# `dependencies` (+ `javascript` / `github_actions`) sám.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
